[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comparators"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "click",
    "pyyaml",
    "rocrate",
    "numpy",
    "pandas>=2,<3",
    "datacompy>=0.19,<0.20"
]

[project.scripts]
compare = "comparators.comparison_cli:compare"

[tool.setuptools.packages.find]
where = ["."]
include = ["comparators*"]
[project.optional-dependencies]
images = ["scikit-image>=0.20", "Pillow>=9"]
hdf5 = ["h5py>=3"]
bio = ["biopython>=1.79", "pysam>=0.19"]
excel = ["openpyxl>=3"]
parquet = ["pyarrow>=15"]
all = ["scikit-image>=0.20", "Pillow>=9", "h5py>=3", "biopython>=1.79", "pysam>=0.19", "openpyxl>=3", "pyarrow>=15"]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
